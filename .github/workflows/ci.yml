name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for component tests
        run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: slide-confirm
          path: |
            dist/slide-confirm.js
            dist/slide-confirm.js.map
          if-no-files-found: error

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: hacs/action@main
        with:
          category: plugin
